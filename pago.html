<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Te llevamos a la plataforma — VictoriaEDU</title>
<meta name="robots" content="noindex">
<!-- El <meta http-equiv="refresh"> se quitó por lo mismo que en checkout.html:
     dominio a mano, ruta que la plataforma ya no usa, y saltaba aunque la
     compra esté cerrada. -->
<link rel="icon" href="uploads/victoriaedu_logo_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/victoria.css?v=21">
<link rel="stylesheet" href="assets/css/victoria-marca.css?v=21">
</head>
<body>

<!-- El paso de pago del sitio se retiró: nunca cobró de verdad, solo generaba
     un folio y enseñaba una CLABE. El cobro vive en la plataforma. Ver el
     comentario largo en checkout.html. -->

<header data-vic-header data-cta="ninguno"></header>

<section class="vic-section vic-section--tight vic-section--luz">
  <div class="vic-container" style="max-width:560px;text-align:center;padding-top:40px;padding-bottom:40px">
    <h1 style="font-size:30px;line-height:1.2;margin:0 0 14px" data-titulo-redirect>Te estamos llevando a la plataforma…</h1>
    <p style="font-size:17px;line-height:1.6;margin:0 0 28px">Ahí pagas y el simulacro se desbloquea en tu cuenta, no en este navegador. Al momento de pagar ves los métodos disponibles.</p>
    <a class="vic-btn vic-btn--primary vic-btn--lg" data-plataforma="comprar" data-metrica="comprar_clic" data-metrica-lugar="redirect-pago">Continuar a la plataforma</a>
  </div>
</section>

<footer data-vic-footer></footer>

<script src="assets/js/config.js?v=21"></script>
<script src="assets/js/ui.js?v=21"></script>
<script src="assets/js/iconos.js?v=21"></script>
<script src="assets/js/metricas.js?v=21"></script>
<script>
  /* Igual que checkout.html: solo salta si la compra está abierta. */
  if (window.VicUI.plataformaAbierta('comprar')) {
    location.replace(window.VicUI.urlComprar());
  } else {
    document.querySelector('[data-titulo-redirect]').textContent =
      'La compra en línea abre en unos días.';
  }
</script>
</body>
</html>
