<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Te llevamos a la plataforma — VictoriaEDU</title>
<meta name="robots" content="noindex">
<!-- Aquí había un <meta http-equiv="refresh"> como respaldo sin JS. Se quitó:
     tenía el dominio y la ruta escritos a mano —ya apuntaba a una URL que la
     plataforma dejó de usar— y, peor, saltaba aunque la compra esté cerrada,
     que es justo lo que el flag de config.js existe para impedir. El salto lo
     decide el script del pie, que sí lee el ambiente. -->
<link rel="icon" href="uploads/victoriaedu_logo_transparent.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/victoria.css?v=22">
<link rel="stylesheet" href="assets/css/victoria-marca.css?v=22">
</head>
<body>

<!-- ==========================================================================
     El checkout del sitio se retiró.

     Guardaba los pedidos en localStorage: no persistían, no se podían
     recuperar desde otro navegador y nadie más que ese alumno los veía. El
     cobro real vive en la plataforma, que sí tiene cuenta, base de datos y
     validación de comprobante por un admin.

     El archivo se queda —en vez de borrarse— porque hay ligas compartidas por
     WhatsApp y marcadores apuntando aquí, y un 404 en la mitad del embudo es
     peor que un rebote de dos segundos.

     Mientras la compra esté cerrada en este ambiente, la página NO salta: se
     queda con su propio texto y el botón abre el aviso de "todavía no". Saltar
     a la plataforma para que ahí rebote a un login sin destino es el peor de
     los dos finales posibles.
     ========================================================================== -->

<header data-vic-header data-cta="ninguno"></header>

<section class="vic-section vic-section--tight vic-section--luz">
  <div class="vic-container" style="max-width:560px;text-align:center;padding-top:40px;padding-bottom:40px">
    <h1 style="font-size:30px;line-height:1.2;margin:0 0 14px" data-titulo-redirect>Te estamos llevando a la plataforma…</h1>
    <p style="font-size:17px;line-height:1.6;margin:0 0 28px">La compra ahora se hace dentro de tu cuenta de VictoriaEDU, para que tu simulacro quede guardado ahí y lo puedas abrir desde cualquier dispositivo.</p>
    <a class="vic-btn vic-btn--primary vic-btn--lg" data-plataforma="comprar" data-metrica="comprar_clic" data-metrica-lugar="redirect-checkout">Continuar a la plataforma</a>
    <p class="vic-hint" style="margin:22px 0 0">¿Todavía no te decides? <a data-plataforma="examen" data-metrica="examen_gratis_clic" data-metrica-lugar="redirect-checkout">Haz primero el examen gratis de 10 reactivos</a>.</p>
  </div>
</section>

<footer data-vic-footer></footer>

<script src="assets/js/config.js?v=22"></script>
<script src="assets/js/ui.js?v=22"></script>
<script src="assets/js/iconos.js?v=22"></script>
<script src="assets/js/metricas.js?v=22"></script>
<script>
  /* Salto inmediato, pero SOLO si la compra está abierta en este ambiente. Va
     después de ui.js porque usa VicUI, que es quien conoce el ambiente y el
     contrato de la URL. Con la compra cerrada la página se queda: el título
     cambia para no prometer un salto que no va a pasar, y el botón —ya
     marcado "Pronto" por ui.js— abre el aviso con el WhatsApp. */
  if (window.VicUI.plataformaAbierta('comprar')) {
    location.replace(window.VicUI.urlComprar());
  } else {
    document.querySelector('[data-titulo-redirect]').textContent =
      'La compra en línea abre en unos días.';
  }
</script>
</body>
</html>
